# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
# AGP 8.13 was tested up to compile SDK 36.1; the app compiles against 37 (targetSdk 37,
# for Accrescent and Google's target-SDK floor). Moving to AGP 9 lifts this, but AGP 9
# changes how the Kotlin Multiplatform module is declared: a separate step.
android.suppressUnsupportedCompileSdk=37.0
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

